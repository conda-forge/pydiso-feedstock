context:
  version: "0.3.0"
  # ensure is_freethreading gets detected as a used variable
  touch_is_freethreading: ${{ is_freethreading }}

package:
  name: pydiso
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pydiso/pydiso-${{ version }}.tar.gz
  sha256: 0b6d0f3f4cb473a5d74179c72a6774181233ea80029f18c3147c3461aa824ac7

build:
  number: 0
  skip:
    - match(python, "<" ~ python_min)
    # the abi3 build is made once on python_min and covers every later (non-freethreading) python
    - is_abi3 and not match(python, python_min ~ ".*")
  python:
    version_independent: ${{ is_abi3 }}
  script:
    - if: is_abi3
      then: ${{ PYTHON }} -m pip install . --no-deps -vv --no-build-isolation
      # Cython can't target the free-threaded stable ABI (abi3t) yet, so those builds opt out of the limited API
      else: ${{ PYTHON }} -m pip install . --no-deps -vv --no-build-isolation -Csetup-args=-Dpython.allow_limited_api=false

requirements:
  build:
    - ${{ stdlib('c') }}
    - ${{ compiler('c') }}
  host:
    - if: is_abi3
      then: python-abi3
    - python
    - pip
    - meson-python >=0.21.0
    - ninja
    - pkg-config
    - cython >=3.1.0
    - numpy
    - setuptools_scm >=6.2
    - mkl-devel
  run:
    - python >=${{ python_min }}
    - numpy >=2.2.0
    - scipy >=1.15.0
  run_constraints:
    # Block openmp from being installed in the same environment (conflicts with numpy and MKL)
    # done by giving an unsatisfiable openmp version.
    # Note: llvm-openmp is safe though.
    - openmp ==99999999999999

tests:
  - python:
      imports:
        - pydiso
        - pydiso.mkl_solver
      python_version:
        - if: is_abi3
          then: ${{ python_min }}.*
        - "*"
  - if: is_abi3
    then:
      python:
        imports:
          - pydiso
          - pydiso.mkl_solver
        python_version: 3.14.*
  - if: is_abi3
    then:
      requirements:
        run:
          - abi3audit
      script:
        - if: unix
          then: abi3audit $SP_DIR/pydiso/_mkl_solver.abi3.so -s -v --assume-minimum-abi3 ${{ python_min }}
          else: abi3audit %SP_DIR%\pydiso\_mkl_solver.pyd -s -v --assume-minimum-abi3 ${{ python_min }}

about:
  homepage: https://www.simpeg.xyz
  license: MIT
  license_file: LICENSE
  summary: 'A simple cython based interface to the pardiso solver'
  repository: https://github.com/simpeg/pydiso

extra:
  recipe-maintainers:
    - jcapriot
    - lheagy
